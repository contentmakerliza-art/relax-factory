# Chrome in a browser tab, only for uploading finished videos to YouTube
# Studio straight from the server disk. Run it just for the upload:
#   bash /opt/relax-factory/deploy/browser.sh start   (and stop afterwards)
# The videos are mounted read-only at /videos; the Chrome profile (Google
# sign-in) is kept in /var/lib/relax-browser.
name: relax-browser
services:
  browser:
    image: lscr.io/linuxserver/chromium:latest
    container_name: relax-browser
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - CHROME_CLI=https://studio.youtube.com
    volumes:
      - /var/lib/relax-browser:/config
      - /var/lib/relax-factory:/videos:ro
    shm_size: 512m
    # the server is small and shared with n8n
    cpus: 1
    mem_limit: 1g
    memswap_limit: 2g
    restart: "no"
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK}
      - traefik.http.routers.relaxbrowser.rule=Host(`browser.${RELAX_HOST}`)
      - traefik.http.routers.relaxbrowser.entrypoints=websecure
      - traefik.http.routers.relaxbrowser.tls=true
      - traefik.http.routers.relaxbrowser.tls.certresolver=${CERT_RESOLVER}
      # the web desktop has a root terminal: never open it without a password
      - traefik.http.routers.relaxbrowser.middlewares=relaxbrowser-auth
      - traefik.http.middlewares.relaxbrowser-auth.basicauth.users=${BROWSER_AUTH:?}
      - traefik.http.services.relaxbrowser.loadbalancer.server.port=3000

networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true
