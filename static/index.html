<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Релакс-фабрика</title>
<style>
  :root { --bg:#f6f4f1; --card:#fff; --text:#2b2a28; --muted:#7a766f; --accent:#6b5bd2; --line:#e6e1da; --ok:#2f8f5b; --err:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1a19; --card:#252422; --text:#eeeae4; --muted:#a39e96; --accent:#9c8ff0; --line:#3a3835; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:24px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:18px; }
  label { display:block; font-weight:600; margin:12px 0 6px; } .hint { font-weight:400; color:var(--muted); font-size:14px; }
  input[type=file], select, input[type=number], input[type=url] { width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); font:inherit; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  details { margin-top:14px; } summary { cursor:pointer; color:var(--accent); }
  button { margin-top:18px; width:100%; padding:14px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-family:inherit; font-size:17px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; }
  .job { border-top:1px solid var(--line); padding:12px 0; } .job:first-child { border-top:0; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:6px 0; } .bar i { display:block; height:100%; background:var(--accent); }
  .st-готово { color:var(--ok); } .st-ошибка { color:var(--err); } .muted { color:var(--muted); font-size:14px; }
  a { color:var(--accent); }
  .thumbs { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:8px 0; } .thumbs img { width:100%; border-radius:6px; display:block; }
  textarea { width:100%; margin-top:6px; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:13px/1.4 ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <h1>Релакс-фабрика</h1>
  <p class="sub">Картинка или клип + альбом треков → готовое длинное видео.</p>

  <form class="card" id="f">
    <label>Картинка или клипы <span class="hint">одна картинка PNG/JPG или несколько клипов MP4, идут по очереди</span></label>
    <input type="file" name="visual" accept="image/*,video/*" multiple>
    <input type="url" name="visual_url" placeholder="или ссылка на папку Google Диска с клипами" style="margin-top:6px">
    <label>Треки <span class="hint">MP3, можно выбрать сразу все</span></label>
    <input type="file" name="tracks" accept="audio/*" multiple>
    <input type="url" name="tracks_url" placeholder="или ссылка на папку Google Диска с треками" style="margin-top:6px">
    <label>Фоновый звук <span class="hint">необязательно: вода, дождь, камин. Тихо идёт под музыкой</span></label>
    <input type="file" name="ambient" accept="audio/*">
    <input type="url" name="ambient_url" placeholder="или ссылка на файл или папку Google Диска" style="margin-top:6px">
    <p class="hint" style="margin:6px 0 0">Ссылка на Диск быстрее загрузки. Доступ к папке: «Все, у кого есть ссылка».</p>
    <div class="row">
      <div><label>Длина, часов</label><input type="number" name="hours" value="3" min="0.1" max="12" step="any"></div>
      <div><label>Качество</label><select name="resolution"><option value="4k">4K</option><option value="1080p">1080p</option></select></div>
      <div><label>Петля клипа</label><select name="loop_mode"><option value="crossfade">Плавная склейка</option><option value="scenes">Сцены (A1, A2 — одна сцена, B1 — следующая)</option><option value="chain">Цепочка</option><option value="pingpong">Вперёд-назад</option></select></div>
    </div>
    <details>
      <summary>Дополнительно</summary>
      <div class="row">
        <div><label>Скорость клипа</label><select name="speed"><option value="1">Обычная</option><option value="0.75">Медленнее</option><option value="0.5">В 2 раза медленнее</option></select></div>
        <div><label>Порядок треков</label><select name="shuffle"><option value="false">Как в альбоме</option><option value="true">Перемешивать</option></select></div>
        <div><label>Громкость фона</label><select name="ambient_level"><option value="-18">Еле слышно</option><option value="-12" selected>Тихо</option><option value="-6">Заметно</option></select></div>
        <div><label>Смена подсветки</label><select name="color_drift"><option value="none">Нет</option><option value="soft">Мягкая</option><option value="full">Все цвета</option></select></div>
      </div>
    </details>
    <button id="go">Рендер</button>
    <p class="muted" id="msg"></p>
  </form>

  <div class="card"><h2 style="margin:0 0 6px;font-size:18px">Очередь</h2><div id="jobs" class="muted">Пока пусто</div></div>
</main>
<script>
const f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
const CHUNK = 4 * 1024 * 1024;  // small pieces: the proxy cuts requests longer than about a minute
async function call(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
f.addEventListener('submit', async e => {
  e.preventDefault();
  const vUrl = f.visual_url.value.trim(), tUrl = f.tracks_url.value.trim(), aUrl = f.ambient_url.value.trim();
  const visual = vUrl ? [] : f.visual.files, tracks = tUrl ? [] : f.tracks.files, ambient = aUrl ? [] : f.ambient.files;
  if (!visual.length && !vUrl) { msg.textContent = 'Выберите клипы или вставьте ссылку на Google Диск'; return; }
  if (!tracks.length && !tUrl) { msg.textContent = 'Выберите треки или вставьте ссылку на Google Диск'; return; }
  const files = [...[...visual].map(x => ['visual', x]), ...[...tracks].map(x => ['tracks', x]),
                 ...[...ambient].map(x => ['ambient', x])];
  const total = files.reduce((n, [, x]) => n + x.size, 0);
  let sent = 0;
  go.disabled = true;
  try {
    const { id } = await call('jobs/new', { method: 'POST' });
    for (const [kind, file] of files) {
      for (let off = 0; off < file.size || off === 0; off += CHUNK) {
        const part = file.slice(off, off + CHUNK);
        const url = `jobs/${id}/files/${kind}/${encodeURIComponent(file.name)}?offset=${off}`;
        for (let attempt = 1; ; attempt++) {
          try { await call(url, { method: 'PUT', body: part }); break; }
          catch (err) {
            if (attempt >= 5) throw err;
            msg.textContent = 'Связь прервалась, повторяю…';
            await new Promise(r => setTimeout(r, 3000 * attempt));
          }
        }
        sent += part.size;
        msg.textContent = 'Загружаю файлы: ' + Math.round(sent / (total || 1) * 100) + '%';
        if (file.size === 0) break;
      }
    }
    const form = new FormData(f);
    form.delete('visual'); form.delete('tracks'); form.delete('ambient');
    await call(`jobs/${id}/start`, { method: 'POST', body: form });
    msg.textContent = 'Добавлено в очередь'; f.reset();
  } catch (err) {
    msg.textContent = 'Ошибка: ' + err.message;
  }
  go.disabled = false; load();
});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function del(id) { if (confirm('Удалить видео и файлы?')) { await fetch('jobs/' + id, {method:'DELETE'}); load(); } }
async function load() {
  const r = await fetch('jobs'); if (!r.ok) return;
  const rows = await r.json(), box = document.getElementById('jobs');
  if (!rows.length) { box.textContent = 'Пока пусто'; return; }
  box.innerHTML = rows.map(j => `<div class="job">
    <b>${esc(j.visual)}</b> · ${j.tracks} треков · ${j.settings.duration / 3600} ч
    <div class="st-${esc(j.status)}">${esc(j.status)}${j.step && j.status !== 'готово' ? ': ' + esc(j.step) : ''}${j.seconds != null ? ' · ' + Math.round(j.seconds / 60) + ' мин' : ''}</div>
    ${j.status === 'работает' ? `<div class="bar"><i style="width:${Math.round(j.progress * 100)}%"></i></div>` : ''}
    ${j.file ? `<a href="jobs/${j.id}/video?watch=1" target="_blank">Смотреть</a> · <a href="jobs/${j.id}/video">Скачать</a> <span class="muted">${j.size_gb} ГБ</span> · ` : ''}
    ${j.previews ? `<div class="thumbs">${[...Array(j.previews)].map((_, i) => `<a href="jobs/${j.id}/preview/${i + 1}?download=1" title="Скачать превью"><img src="jobs/${j.id}/preview/${i + 1}" alt="Превью ${i + 1}"></a>`).join('')}</div>` : ''}
    ${j.timecodes ? `<details><summary>Таймкоды для описания</summary><textarea readonly rows="8">${esc(j.timecodes)}</textarea><a href="#" onclick="navigator.clipboard.writeText(this.previousElementSibling.value);this.textContent='Скопировано';return false">Скопировать</a></details>` : ''}
    ${j.status !== 'работает' ? `<a href="#" onclick="del('${j.id}');return false">Удалить</a>` : ''}
  </div>`).join('');
}
load(); setInterval(load, 4000);
</script>
</body>
</html>
